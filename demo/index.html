<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gh-htmlpreview demo</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <img src="logo.svg" alt="" width="72" height="72">
    <h1>gh-htmlpreview demo</h1>
    <p>
      This page is served from a GitHub repository by
      <a href="https://github.com/jayqi/gh-htmlpreview">gh-htmlpreview</a>. Its stylesheet, script,
      image and data are separate files next to it, fetched from the same commit.
    </p>
    <h2>Loaded from data.json</h2>
    <p id="status">Loading…</p>
    <ul id="files"></ul>
    <p><a href="other.html">Go to another page</a> in the same folder.</p>
  </main>
</body>
</html>
