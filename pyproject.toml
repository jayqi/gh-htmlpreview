[project]
name = "gh-htmlpreview"
version = "0.1.0"
description = "Preview HTML files from GitHub repositories in your browser."
readme = "README.md"
authors = [
    { name = "Jay Qi", email = "jayqi@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gh-htmlpreview = "gh_htmlpreview.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    { include-group = "tests" },
    { include-group = "typecheck" },
]
tests = [
    "coverage",
    "pytest-cov",
    "pytest",
]
typecheck = [
    "ty",
]
vspect = [
    "vspect",
]

## TOOLS

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", # Pycodestyle
  "F", # Pyflakes
  "I", # isort
]
unfixable = ["F"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=gh_htmlpreview --cov-report=term --cov-report=html"
testpaths = ["tests"]

[tool.coverage.run]
source = ["gh_htmlpreview"]
# debug = ["pathmap"]  # Useful if path mapping isn't working as expected

[tool.coverage.paths]
gh_htmlpreview = [
  "src/gh_htmlpreview/",
  "*/src/gh_htmlpreview/",
  "*/site-packages/gh_htmlpreview/"
]
